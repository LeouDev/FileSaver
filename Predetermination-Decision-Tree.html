<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Predetermination Decision Tree</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&display=swap">
<style>
/* Windows 98 look borrowed from KASSIX POS: teal desktop, bevelled silver windows, navy title bars. */
:root { --desktop:#008080; --face:#c0c0c0; --light:#dfdfdf; --shade:#808080; --navy:#000080; --sky:#1084d0; --brand:#c00000; --maroon:#800000; --ok:#008000; --lcd:#39ff14; --tip:#ffffe1;
  --pixel:"Silkscreen",ui-monospace,monospace; --lcdfont:"VT323",ui-monospace,monospace; }
* { box-sizing:border-box; }
html,body { height:100%; margin:0; }
body { background:var(--desktop); color:#000; font:14px/1.45 Tahoma,Verdana,"Segoe UI",system-ui,sans-serif; }
::selection { background:var(--navy); color:#fff; }
button { font:inherit; cursor:pointer; }
h1,h2,p,ol,ul { margin:0; }
::-webkit-scrollbar { width:16px; height:16px; background:#dfdfdf; }
::-webkit-scrollbar-thumb { background:#c0c0c0; border:1px solid; border-color:#fff #000 #000 #fff; box-shadow:inset -1px -1px #808080; }

.window { background:var(--face); border:1px solid; border-color:#dfdfdf #000 #000 #dfdfdf; box-shadow:inset -1px -1px #808080, inset 1px 1px #fff; padding:3px; display:flex; flex-direction:column; min-height:0; }
.titlebar { display:flex; align-items:center; gap:6px; min-height:24px; padding:2px 3px 2px 6px; background:linear-gradient(90deg,#000080,#1084d0); color:#fff; font-weight:700; user-select:none; }
.titlebar h1, .titlebar h2 { flex:1; min-width:0; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tb-btn { display:grid; place-items:center; width:20px; height:18px; background:var(--face); color:#000; font-size:12px; font-weight:700; line-height:1; border:1px solid; border-color:#fff #000 #000 #fff; box-shadow:inset -1px -1px #808080; }
.sunken { background:#fff; border:1px solid; border-color:#808080 #fff #fff #808080; box-shadow:inset 1px 1px #000; }
.separator { border-top:1px solid #808080; border-bottom:1px solid #fff; margin:6px 8px; }
.groupbox { border:1px solid #808080; box-shadow:inset 1px 1px #fff, 1px 1px #fff; padding:10px 12px 12px; margin:0 0 12px; min-width:0; }
.groupbox > legend { padding:0 4px; font-weight:700; }
.pixel { font-family:var(--pixel); }

.btn { position:relative; display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:36px; padding:0 14px; background:var(--face); color:#000; white-space:nowrap; border:1px solid; border-color:#fff #000 #000 #fff; box-shadow:inset -1px -1px #808080, inset 1px 1px #dfdfdf; user-select:none; text-decoration:none; -webkit-tap-highlight-color:transparent; }
.btn:active:not(:disabled), .btn[aria-pressed="true"], .btn[aria-current="true"], .btn[aria-expanded="true"] { border-color:#000 #fff #fff #000; box-shadow:inset 1px 1px #808080; }
.btn[aria-pressed="true"], .btn[aria-current="true"] { background-color:#dcdcdc; background-image:repeating-conic-gradient(#fff 0 25%, #dcdcdc 0 50%); background-size:2px 2px; font-weight:700; }
.btn:active:not(:disabled) > * { transform:translate(1px,1px); }
.btn:focus-visible { outline:none; }
.btn:focus-visible::after { content:""; position:absolute; inset:4px; border:1px dotted #000; pointer-events:none; }
.btn:disabled { color:#808080; text-shadow:1px 1px #fff; cursor:default; }
.btn-sm { min-height:28px; padding:0 10px; font-size:13px; }
.btn-block { width:100%; justify-content:flex-start; text-align:left; }
.opt { width:100%; justify-content:flex-start; text-align:left; white-space:normal; min-height:48px; padding:6px 12px; font-size:15px; }
.opt small { display:block; font-size:12px; color:#404040; }
kbd { display:inline-grid; place-items:center; flex:none; min-width:24px; height:24px; font:700 12px var(--pixel); background:#fff; border:1px solid; border-color:#808080 #fff #fff #808080; box-shadow:inset 1px 1px #000; }
.lcd { background:#000; color:var(--lcd); font-family:var(--lcdfont); font-size:26px; line-height:1; padding:3px 10px; border:1px solid; border-color:#808080 #fff #fff #808080; white-space:nowrap; }
.statusbar { display:flex; gap:2px; padding-top:3px; font-size:12px; }
.statusbar > * { min-width:0; padding:2px 6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; border:1px solid; border-color:#808080 #fff #fff #808080; }
.menu-item { display:flex; align-items:center; gap:10px; width:100%; min-height:36px; padding:0 12px; background:none; border:0; text-align:left; color:#000; }
.menu-item:hover, .menu-item:focus-visible { background:var(--navy); color:#fff; outline:none; }
.swatch { flex:none; width:14px; height:14px; border:1px solid #000; }

/* Layout */
.app { display:flex; flex-direction:column; height:100dvh; }
.desk { flex:1; min-height:0; display:flex; gap:12px; padding:12px; }
.side { width:230px; flex:none; }
.main { flex:1; min-width:0; }
.trail { width:300px; flex:none; }
.toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:6px; padding:6px 4px; border-bottom:1px solid #808080; box-shadow:0 1px #fff; }
.body { flex:1; min-height:0; overflow:auto; padding:16px; }
.body:focus, #focusTarget:focus { outline:none; }
.content { max-width:760px; }
.logo { padding:12px 12px 8px; }
.logo b { font:700 22px/1 var(--pixel); color:var(--navy); letter-spacing:1px; }
.logo b span { color:var(--brand); }
.logo p { font:10px var(--pixel); color:var(--navy); margin-top:4px; }
.sys-switch { display:flex; gap:4px; padding:0 8px 4px; }
.sys-switch .btn { flex:1; }
.programs { list-style:none; padding:4px 8px; display:flex; flex-direction:column; gap:4px; }
.side-foot { margin-top:auto; padding:8px; font-size:12px; }
.side-foot .sunken { padding:6px 8px; }

.question { font-size:19px; font-weight:700; margin:2px 0 12px; }
.options { display:flex; flex-direction:column; gap:8px; }
.tip { background:var(--tip); border:1px solid #000; padding:8px 10px; margin:0 0 12px; font-size:13px; }
.tip table { margin:6px 0; background:#fff; }
.warn { background:#fff; border:2px solid var(--brand); padding:8px 10px; margin:0 0 12px; font-size:13px; }
.do-first ol, .steps { padding-left:22px; }
.do-first li, .steps li { margin:4px 0; }
.outcome { display:flex; align-items:center; gap:10px; padding:8px 12px; margin-bottom:12px; color:#fff; font-size:17px; font-weight:700; border:1px solid #000; }
.outcome .ico { display:grid; place-items:center; flex:none; width:28px; height:28px; background:#fff; border:1px solid #000; font:700 16px var(--pixel); }
.tone-go { background:var(--ok); } .tone-go .ico { color:var(--ok); }
.tone-stop { background:var(--maroon); } .tone-stop .ico { color:var(--maroon); }
.tone-appeal { background:var(--navy); } .tone-appeal .ico { color:var(--navy); }
.tone-info { background:var(--face); color:#000; box-shadow:inset -1px -1px #808080, inset 1px 1px #fff; } .tone-info .ico { color:var(--navy); }
.copy { margin:0 0 10px; }
.copy-head { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:4px; font-size:13px; font-weight:700; }
.copy pre { margin:0; padding:8px 10px; white-space:pre-wrap; font:13px/1.45 "Courier New",ui-monospace,monospace; }
.ref { margin-top:14px; font-size:12px; color:#404040; }
.listview { width:100%; border-collapse:separate; border-spacing:0; font-size:13px; }
.listview th { padding:4px 8px; background:var(--face); font-weight:400; text-align:left; border:1px solid; border-color:#fff #808080 #808080 #fff; }
.listview td { padding:6px 8px; vertical-align:top; }
.listview tbody tr:nth-child(even) td { background:#f4f4f4; }
.trail-list { list-style:none; padding:0; margin:0; overflow:auto; flex:1; }
.trail-list button { display:block; width:100%; text-align:left; padding:6px 8px; background:none; border:0; border-bottom:1px dotted #808080; font-size:12px; }
.trail-list button:hover, .trail-list button:focus-visible { background:var(--navy); color:#fff; outline:none; }
.trail-list b { display:block; font-size:13px; }
.trail-list .now { padding:6px 8px; font-size:12px; font-weight:700; background:#fff; }
.empty { padding:10px; font-size:12px; color:#404040; }

/* Taskbar + start menu */
.taskbar { position:relative; flex:none; display:flex; align-items:center; gap:4px; height:40px; padding:0 4px; background:var(--face); border-top:1px solid #dfdfdf; box-shadow:inset 0 1px #fff; }
.start-logo { width:14px; height:14px; border:1px solid #000; background:linear-gradient(135deg,#c00000 0 50%,#000080 50%); }
.task { max-width:220px; min-width:0; justify-content:flex-start; border-color:#000 #fff #fff #000; box-shadow:inset 1px 1px #808080; }
.task span { overflow:hidden; text-overflow:ellipsis; }
.tray { height:30px; display:flex; align-items:center; gap:8px; padding:0 8px; font-size:12px; border:1px solid; border-color:#808080 #fff #fff #808080; }
.start-menu { position:absolute; bottom:100%; left:2px; margin-bottom:2px; z-index:50; flex-direction:row; box-shadow:inset -1px -1px #808080, inset 1px 1px #fff, 4px 4px 0 rgb(0 0 0 / .3); }
.start-menu[hidden] { display:none; }
.start-band { width:28px; display:flex; align-items:flex-end; justify-content:center; padding:8px 0; background:linear-gradient(0deg,#000080,#1084d0); }
.start-band span { writing-mode:vertical-rl; transform:rotate(180deg); color:#fff; font:700 14px var(--pixel); letter-spacing:2px; }
.start-menu nav { min-width:250px; padding:4px 0; }
.start-menu p { padding:2px 12px; font-size:12px; color:#404040; }

@media (max-width:1100px) { .trail { display:none; } }
@media (max-width:820px) {
  .side { display:none; }
  .desk { padding:0; }
  .body { padding:12px; }
  .question { font-size:17px; }
}
@media (pointer:coarse) { .btn { min-height:44px; } .btn-sm { min-height:40px; } }
@media (prefers-reduced-motion:reduce) { * { transition:none !important; } }
</style>
</head>
<body>
<div class="app">
  <div class="desk">
    <nav class="window side" aria-label="Programs">
      <div class="titlebar"><span style="flex:1">Programs</span></div>
      <div class="logo"><b>PRE<span>D</span>ET</b><p>Medicare readiness 2026–2027</p></div>
      <div class="sys-switch" role="group" aria-label="System" id="sysSwitch"></div>
      <div class="separator"></div>
      <ul class="programs" id="programs"></ul>
      <div class="side-foot"><div class="sunken">Source: <b>Medicare Annual Readiness for Techs</b>, <span id="deckName"></span> edition. Slide numbers refer to that deck.</div></div>
    </nav>

    <section class="window main">
      <div class="titlebar"><h1 id="title"></h1><span class="tb-btn" aria-hidden="true">_</span><span class="tb-btn" aria-hidden="true">□</span><span class="tb-btn" aria-hidden="true">×</span></div>
      <div class="toolbar">
        <button class="btn btn-sm" id="back" title="Back (Backspace)">◄ Back</button>
        <button class="btn btn-sm" id="restart" title="Start over">↺ Restart</button>
        <button class="btn btn-sm" id="copyTrail" title="Copy the path taken as text">Copy trail</button>
        <span style="flex:1"></span>
        <span class="lcd" id="lcd" aria-label="Step"></span>
      </div>
      <div class="body" id="body" tabindex="-1"></div>
      <div class="statusbar"><span id="stSys"></span><span id="stRef" style="flex:1"></span><span>Keys: 1–9 choose · Backspace back</span></div>
    </section>

    <aside class="window trail" aria-label="Trail">
      <div class="titlebar"><h2>Trail</h2></div>
      <ol class="trail-list sunken" id="trail"></ol>
    </aside>
  </div>

  <div class="taskbar">
    <button class="btn btn-sm" id="startBtn" aria-expanded="false" aria-controls="startMenu" style="font-weight:700"><span class="start-logo"></span>Start</button>
    <span class="btn btn-sm task" id="task" aria-hidden="true"></span>
    <span style="flex:1"></span>
    <div class="tray"><b id="traySys"></b><span id="clock"></span></div>
    <div class="window start-menu" id="startMenu" hidden>
      <div class="start-band"><span>PREDET</span></div>
      <nav aria-label="Start menu" id="startNav"></nav>
    </div>
  </div>
</div>

<script>
// Decision trees for the Medicare Annual Readiness 2026-2027 decks (PANDA and PAS editions).
// Question nodes: { q, options, help?, do?, ref? }. Result nodes: { result, tone, steps, copy?, note?, options?, ref? }.
// `ref` is the slide number in that system's deck. Option `next` ids must exist in the same system.

const o = (label, next, hint) => ({ label, next, hint });
const Q = (q, options, extra = {}) => ({ q, options, ...extra });
const R = (result, tone, steps, extra = {}) => ({ result, tone, steps, ...extra });

const nyeVerbiage = (date) =>
  `PA-<*#*> has been cancelled for <*drug*>, use as directed, for the following reason: Pre-benefit determination reviews for the 2027 Part D benefit are not yet available for this plan. Please resubmit your prior authorization request for the 2027 benefit year beginning ${date}.`;

const BOOK_A = [
  { start: "10/15/2026", verbiage: "October 15, 2026", clients: ["BCBS-SC*", "Compass Rose", "Eternal Health", "Samaritan", "Union Pacific"] },
  { start: "11/01/2026", verbiage: "November 1, 2026", clients: ["Clover Health", "KelseyCare Advantage", "MPSERS", "Provider Partners Health Plan (PPHP)", "Quartz", "State of New Jersey"] },
  { start: "12/01/2026", verbiage: "December 1st, 2026", clients: ["AlohaCare", "BCBS-AZ", "CareOregon (CORMCARE)", "Fallon", "IBCMEDDNJ", "IBCMEDDPA", "MGBHP", "Sanford"] },
];

const BOOK_A_TABLE =
  `<table class="listview"><thead><tr><th>Start date</th><th>Book A clients allowing predetermination</th></tr></thead><tbody>` +
  BOOK_A.map((g) => `<tr><td><b>${g.start}</b></td><td>${g.clients.join(", ")}</td></tr>`).join("") +
  `</tbody></table><p>* The table lists BCBS-SC at 10/15, but the BCBS-SC slide (36) says 11/1/2026. The BCBS-SC flow uses 11/1. Confirm with leadership.</p>`;

const PREFERRED_DTS =
  "UHCM&R preferred meters: Accu-Chek Guide, Accu-Chek Guide Me, Contour Next EZ, Contour Next Gen, Contour Next One, Contour Plus Blue. Preferred strips: Accu-Chek Aviva Plus, Accu-Chek Guide, Contour, Contour Next, Contour Plus.";

// [first request year, first denied in, second request year, second reviewed in, action]
const RVA_STANDARD = [
  ["2026", "2026", "2026", "2026", "Appeal"],
  ["2026", "2026", "2026", "2027", "Review*"],
  ["2026", "2026", "2027", "2027", "Review*"],
  ["2026", "2026", "2027", "2026", "Review"],
  ["2026", "2027", "2027", "2027", "Review*"],
  ["2027", "2026", "2027", "2026", "Appeal"],
  ["2027", "2026", "2027", "2027", "Review*"],
  ["2027", "2027", "2027", "2027", "Appeal"],
];
const RVA_IBC = [
  ["2026", "2026", "2026", "2026", "Appeal"],
  ["2026", "2026", "2026", "2027", "Appeal"],
  ["2026", "2026", "2027", "2027", "Appeal"],
  ["2026", "2026", "2027", "2026", "Review"],
  ["2026", "2027", "2027", "2027", "Appeal"],
  ["2027", "2026", "2027", "2026", "Appeal"],
  ["2027", "2026", "2027", "2027", "Appeal"],
  ["2027", "2027", "2027", "2027", "Appeal"],
];

// Builds one question per chart column; only answers that exist in the chart are offered.
function rvaNodes(prefix, rows, ref) {
  const asks = [
    "What benefit year was the FIRST (denied) request for?",
    "What year was the first request denied in?",
    "What benefit year is the SECOND request (same drug) for?",
    "What year is the second request being reviewed in?",
  ];
  const labels = ["request", "denied in", "request", "reviewed in"];
  const nodes = {};
  const walk = (answers) => {
    const id = [prefix, ...answers].join(":");
    const matching = rows.filter((r) => answers.every((a, i) => r[i] === a));
    if (answers.length === 4) {
      const action = matching[0][4];
      const appeal = action === "Appeal";
      const summary = `${answers[0]} request denied in ${answers[1]} → ${answers[2]} request reviewed in ${answers[3]}`;
      nodes[id] = R(appeal ? "Send to Appeals" : "Review the case", appeal ? "appeal" : "go", [
        summary,
        appeal ? "A denial within the look-back window is on file for this situation. Forward the case to Appeals (follow the appeal process)." : "Take the case in for review.",
        ...(action === "Review*" ? ["Clean slate: a new benefit year voids the prior-year denial. *If the second request asks for an appeal, forward it to Appeals."] : []),
        ...(answers[0] !== answers[2] ? ["Current-year and future-year requests are not duplicates. Each gets its own review."] : []),
      ], { ref });
      return id;
    }
    const values = [...new Set(matching.map((r) => r[answers.length]))];
    nodes[id] = Q(asks[answers.length], values.map((v) => o(`${v} ${labels[answers.length]}`, walk([...answers, v]))), { ref });
    return id;
  };
  walk([]);
  return nodes;
}

// Nodes shared by both systems; `S` is the system name, `p` maps topics to that deck's slide numbers.
function common(S, p) {
  const nodes = {
    // ── Intake gate ──
    intake: Q("Did the provider or member specifically ask for a future-year (2027) review?", [
      o("Yes, a 2027 / future-year review was requested", "client"),
      o("No, or I would have to ask them", "res_standard", "Never solicit a predetermination review"),
    ], {
      help: "Agents must not solicit predetermination reviews.<br>• <b>Phone:</b> the caller must say it. Don't ask.<br>• <b>Fax:</b> check every image. A predetermination box checked for a <i>previous</i> year still counts.<br>• <b>ePA:</b> the provider indicates the request is for 2027.",
      ref: p.request,
    }),
    res_standard: R("Not a predetermination: process as current year", "info", [
      "Enter the request per standard current-year processes.",
      "Do NOT select the Pre-benefit Determination flag.",
    ], { ref: p.request }),

    client: Q("Which client / plan is the member under?", [
      o("UHCM&R / Book 1 (standard)", "date"),
      o("Book A client", "bookA"),
      o("IBC Medicare (IBCMEDD)", "ibc_date", "Predetermination starts 11/01/2026"),
      o("BlueCross BlueShield South Carolina (BCBS-SC)", "bcbs_date", "Predetermination starts 11/01/2026"),
    ], { ref: p.overview }),

    date: Q("When was the predetermination request received?", [
      o("Before 10/15/2026", "pre1015"),
      o("On or after 10/15/2026", "found"),
    ], { help: "Predetermination reviews run 10/15 – 12/31 for accounts effective 1/1/2027. Before 10/15, select only current accounts (Elig Status = Current).", ref: p.pre1015 }),

    pre1015: Q(`Does the member have NO current coverage AND a Business Segment of UHCMR MAPD & PDP in ${S}?`, [
      o("Yes", "res_nonaep"),
      o("No", "res_nye"),
    ], { ref: p.pre1015 }),
    res_nonaep: R("Use the Non-AEP review process", "info", [
      "The Not Yet Eligible rule does not apply to this member.",
      "Follow the UHCM&R Non-Annual Enrollment Period (AEP) Reviews section of the Medicare Overview for Techs Job Aid.",
    ], { ref: p.pre1015 }),
    res_nye: R("Cancel: Not Yet Eligible", "stop", [
      "Cancel the case as Not Yet Eligible.",
      "No tracking is required.",
      "The member or provider must resubmit on or after 10/15/2026.",
    ], {
      copy: [
        { label: "Phone script: member", text: "For your convenience, the Prior Authorization Department will begin to review pre-benefit determinations for 2027 on October 15th. We will not be able to hold or accept requests until that day. Either you or your provider can call back on or after October 15th and we will be happy to process your request." },
        { label: "Phone script: provider", text: "For your convenience, the Prior Authorization Department will begin to review pre-benefit determinations for 2027 on October 15th. We will not be able to hold or accept requests until that day. Please call back on or after October 15th and we will be happy to process your request." },
      ],
      ref: p.pre1015,
    }),

    found: Q(`Search ${S} for the member. What accounts come back?`, [
      o("Current-year account (with or without a future account)", "channel"),
      o("Future-year account only (new member)", "res_future_only"),
      o("Member not found", "res_mnf"),
    ], { help: p.searchHelp, ref: p.search }),
    res_future_only: R("Treat every request as a predetermination", "go", [
      "Only future eligibility exists, so accept that all requests for this member are predetermination requests.",
      "Select the Pre-benefit Determination flag. The Req PA Start Date defaults to 1/1/2027.",
      "Notate the Call Detail.",
    ], { ref: p.overview }),
    res_mnf: R("Cancel: Member Not Found", "stop", [
      `Between 10/15 and 12/31, requests for members NOT found in ${S} are cancelled as "member not found".`,
      "These are not tracked (this includes new Book 1 clients).",
    ], {
      copy: [{ label: "Talking point: not enrolled yet", text: "OptumRx is unable to review a request if your enrollment information is not finalized. If your enrollment is not finalized, OptumRx is unable to view or determine your benefits to decide if a PA is required. Once you have enrolled in a participating plan, you may contact your member services to determine when your benefits are viewable by OptumRx and when your doctor can submit the PA request." }],
      ref: p.overview,
    }),

    // ── Book A ──
    bookA: Q("Is the client listed in the Book A \"Clients Allowing Predetermination Review\" table?", [
      o("Yes, listed", "bookA_start"),
      o("No, not listed", "bookA_epro", "Book A clients do not allow predetermination unless stated otherwise"),
    ], { help: BOOK_A_TABLE, ref: p.bookA }),
    bookA_start: Q("Which predetermination start date applies to the client?", BOOK_A.map((g, i) => o(g.start, `bookA_d${i}`, g.clients.join(", "))), { help: BOOK_A_TABLE, ref: p.bookA }),
    ...Object.fromEntries(BOOK_A.flatMap((g, i) => [
      [`bookA_d${i}`, Q(`Was the request received before ${g.start}?`, [o("Yes, before the start date", `bookA_nye${i}`), o("No, on or after", "found")], { ref: p.bookA })],
      [`bookA_nye${i}`, R("Cancel: Not Yet Eligible (client verbiage)", "stop", [
        "Cancel with the Not Yet Eligible cancel reason code.",
        "Use the client-specific verbiage below.",
        "Check current-year UM criteria, and follow all MPA cancellation processes if the request is an MPA.",
      ], { copy: [{ label: "Cancel verbiage", text: nyeVerbiage(g.verbiage) }], ref: p.bookA })],
    ])),
    bookA_epro: Q("Did the request originate as an ePRO?", [
      o("Yes", "res_bookA_epro"),
      o("No", "res_bookA_nye"),
    ], { ref: p.bookANew }),
    res_bookA_epro: R("Follow standard ePRO practices", "info", ["Cases that originated as an ePRO follow standard practices."], { ref: p.bookANew }),

    cy_done: R("No further action needed", "info", ["The current-year request was approved. No further action is necessary."], { ref: "17, 19" }),
    cy_copy: R("Copy Case to enter the predetermination", "go", [
      "Use the Copy Case button (PAS) to enter a predetermination request per standard processes (Pre-benefit flag selected).",
    ], { note: FLAG_REMINDER, ref: "17, 19" }),

    res_mpa: R("Member-initiated request", "go", [
      "Check notes for signs of a predetermination request, e.g. \"Requesting CD in advance – Future Coverage Year\".",
      "Always do the current-year review first, then the future-year review (Start menu → Current Year UM Check).",
      "MPA requests for non-diabetic supplies started by phone techs need the paperclip note below.",
      "If the member asked for a future-year review but the provider responds without asking for a current-year review, treat it as a future-year review, per the member's request.",
    ], { copy: [{ label: "Paperclip note", text: "Subject: Future Year Predetermination Request\nVerbiage: Member requesting predetermination review" }], ref: 5 }),

    tcse: Q("Is the medication Tier 1 in the current year?", [o("Yes, Tier 1", "tcse_t1"), o("No", "tcse_cy")], {
      help: "For a future-year TCSE on a member with current-year coverage, first decide whether a current-year TCSE review is needed. The only exception is a current-year Tier 1 drug.",
      ref: 15,
    }),
    tcse_t1: R("Skip the current-year TCSE check", "go", ["Tier 1 in the current year, so no current-year TCSE review is needed.", "Enter the future-year TCSE predetermination request (Pre-benefit flag selected)."], { note: FLAG_REMINDER, ref: 15 }),
    tcse_cy: R("Check current-year TCSE first", "go", [
      "Decide whether a current-year TCSE review is needed and handle it per standard processes (no Pre-benefit flag).",
      "Then enter the future-year TCSE predetermination request, using Copy Case where it applies (Pre-benefit flag selected).",
    ], { note: FLAG_REMINDER, ref: 15 }),
  },
};

const TREES = { PANDA, PAS };
if (typeof module !== "undefined") module.exports = TREES;

</script>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const ICON = { go: "✓", stop: "✕", appeal: "!", info: "i" };

function parse() {
  const [, sys, flow, path = ""] = location.hash.split("/");
  const t = TREES[sys] ?? TREES.PANDA;
  const f = t.flows.find((x) => x.id === flow) ?? t.flows[0];
  return { t, f, path: path ? path.split(".").map(Number) : [] };
}
const go = (sys, flow, path = []) => { location.hash = `#/${sys}/${flow}/${path.join(".")}`; render(); };

// Replays the chosen option indexes from the flow's start node; stops at the first invalid index.
function walk(t, f, path) {
  const trail = [];
  let id = f.id;
  for (const i of path) {
    const opt = t.nodes[id].options?.[i];
    if (!opt) break;
    trail.push({ node: t.nodes[id], opt, i });
    id = opt.next;
  }
  return { trail, id, node: t.nodes[id] };
}

function nodeHtml(n) {
  let h = "";
  if (n.q) {
    if (n.do) h += `<fieldset class="groupbox do-first"><legend>Do this first</legend><ol>${n.do.map((d) => `<li>${esc(d)}</li>`).join("")}</ol></fieldset>`;
    h += `<p class="question" id="focusTarget" tabindex="-1">${esc(n.q)}</p>`;
    if (n.help) h += `<div class="tip">${n.help}</div>`;
    if (n.note) h += `<div class="warn"><b>Heads-up:</b> ${esc(n.note)}</div>`;
  } else {
    h += `<div class="outcome tone-${n.tone}" id="focusTarget" tabindex="-1"><span class="ico">${ICON[n.tone]}</span><span>${esc(n.result)}</span></div>`;
    if (n.steps.length) h += `<fieldset class="groupbox"><legend>What to do</legend><ol class="steps">${n.steps.map((s) => `<li>${esc(s)}</li>`).join("")}</ol></fieldset>`;
    (n.copy ?? []).forEach((c, i) => {
      h += `<div class="copy"><div class="copy-head"><span>${esc(c.label)}</span><button class="btn btn-sm" data-copy="${i}">Copy</button></div><pre class="sunken">${esc(c.text)}</pre></div>`;
    });
    if (n.note) h += `<div class="tip">${esc(n.note)}</div>`;
  }
  if (n.options?.length) {
    h += `<div class="options">${n.options.map((o, i) =>
      `<button class="btn opt" data-opt="${i}">${i < 9 ? `<kbd>${i + 1}</kbd>` : ""}<span>${esc(o.label)}${o.hint ? `<small>${esc(o.hint)}</small>` : ""}</span></button>`).join("")}</div>`;
  } else {
    h += `<div class="options" style="margin-top:12px"><button class="btn" data-restart>↺ Start a new case</button></div>`;
  }
  if (n.ref) h += `<p class="ref">Source: slide ${esc(n.ref)}</p>`;
  return h;
}

let current; // { t, f, path, trail, node }
function render() {
  const { t, f, path } = parse();
  const { trail, node } = walk(t, f, path);
  const validPath = trail.map((s) => s.i);
  current = { t, f, path: validPath, trail, node };

  document.title = `${t.name}: ${f.title}`;
  $("#title").textContent = `${t.name}: ${f.title}`;
  $("#deckName").textContent = t.name;
  $("#lcd").textContent = node.result ? "DONE" : `STEP ${String(trail.length + 1).padStart(2, "0")}`;
  $("#stSys").textContent = `${t.name} edition`;
  $("#stRef").textContent = node.ref ? `Slide ${node.ref}` : "";
  $("#traySys").textContent = t.name;
  $("#task").innerHTML = `<span class="swatch" style="background:${f.color}"></span><span>${esc(f.title)}</span>`;
  $("#back").disabled = !trail.length;

  $("#sysSwitch").innerHTML = Object.keys(TREES).map((s) =>
    `<button class="btn btn-sm" data-sys="${s}" aria-pressed="${s === t.name}">${s}</button>`).join("");
  $("#programs").innerHTML = t.flows.map((x) =>
    `<li><button class="btn btn-block" data-flow="${x.id}" aria-current="${x.id === f.id}"><span class="swatch" style="background:${x.color}"></span>${esc(x.title)}</button></li>`).join("");
  $("#startNav").innerHTML = `<p>${t.name} programs</p>` + t.flows.map((x) =>
    `<button class="menu-item" data-flow="${x.id}"><span class="swatch" style="background:${x.color}"></span>${x.id === f.id ? `<b>${esc(x.title)}</b>` : esc(x.title)}</button>`).join("") +
    `<div class="separator"></div><p>Switch system</p>` + Object.keys(TREES).map((s) =>
    `<button class="menu-item" data-sys="${s}"><span class="swatch" style="background:${s === t.name ? "#000080" : "#fff"}"></span>${s}</button>`).join("");

  $("#trail").innerHTML = trail.length
    ? trail.map((s, i) => `<li><button data-jump="${i}" title="Go back to this question"><b>${esc(s.opt.label)}</b>${esc(s.node.q ?? s.node.result)}</button></li>`).join("") +
      `<li class="now">► ${esc(node.q ?? node.result)}</li>`
    : `<li class="empty">Your answers will show up here. Click one to go back to it.</li>`;

  $("#body").innerHTML = `<div class="content">${nodeHtml(node)}</div>`;
  $("#body").scrollTop = 0;
  $("#focusTarget")?.focus({ preventScroll: true });
}

const choose = (i) => { const opt = current.node.options?.[i]; if (opt) go(current.t.name, current.f.id, [...current.path, i]); };
const back = () => current.path.length && go(current.t.name, current.f.id, current.path.slice(0, -1));

async function copyText(text, btn) {
  try { await navigator.clipboard.writeText(text); } catch { return; }
  const old = btn.textContent;
  btn.textContent = "Copied ✓";
  setTimeout(() => (btn.textContent = old), 1200);
}

function toggleStart(open) {
  $("#startMenu").hidden = !open;
  $("#startBtn").setAttribute("aria-expanded", open);
  if (open) $("#startNav button")?.focus();
}

document.addEventListener("click", (e) => {
  const el = e.target.closest("button");
  if (!e.target.closest("#startMenu, #startBtn")) toggleStart(false);
  if (!el) return;
  const d = el.dataset;
  if (el.id === "startBtn") return toggleStart($("#startMenu").hidden);
  if (el.id === "back") return back();
  if (el.id === "restart" || "restart" in d) return go(current.t.name, current.f.id);
  if (el.id === "copyTrail") {
    const n = current.node;
    const lines = [`${current.t.name}: ${current.f.title}`, ...current.trail.map((s) => `• ${s.node.q ?? s.node.result} → ${s.opt.label}`),
      n.result ? `RESULT: ${n.result}\n${n.steps.map((s, i) => `  ${i + 1}. ${s}`).join("\n")}` : `NEXT: ${n.q}`];
    return copyText(lines.join("\n"), el);
  }
  if ("opt" in d) return choose(+d.opt);
  if ("jump" in d) return go(current.t.name, current.f.id, current.path.slice(0, +d.jump));
  if ("copy" in d) return copyText(current.node.copy[+d.copy].text, el);
  if ("flow" in d) { toggleStart(false); return go(current.t.name, d.flow); }
  if ("sys" in d) { toggleStart(false); const t = TREES[d.sys]; return go(d.sys, t.flows.some((x) => x.id === current.f.id) ? current.f.id : t.flows[0].id); }
});

document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "Escape") { toggleStart(false); return $("#startBtn").focus(); }
  if (!$("#startMenu").hidden) return;
  if (/^[1-9]$/.test(e.key)) choose(+e.key - 1);
  else if (e.key === "Backspace") { e.preventDefault(); back(); }
});

function tick() { $("#clock").textContent = new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }); }
setInterval(tick, 15000); tick();
addEventListener("hashchange", render);
render();
</script>
</body>
</html>
